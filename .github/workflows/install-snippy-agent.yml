name: Install Snippy agent

# One-off. Installs the SnippyCode agent on the demo server.
# deploy cannot sudo, but it can run Docker, so the installer and the
# systemctl check enter the host namespaces with nsenter. Still uses DEMO_SSH_KEY.
# The enrol token is masked and passed on stdin, not on the runner command line.
on:
  workflow_dispatch:
    inputs:
      ssh_user:
        description: SSH user on the demo server
        default: deploy
        required: false

permissions:
  contents: read

concurrency:
  group: install-snippy-agent
  cancel-in-progress: false

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo
    env:
      DEMO_HOST: ${{ secrets.DEMO_HOST }}
      DEMO_SSH_USER: ${{ inputs.ssh_user || 'deploy' }}
      DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
      DEMO_PATH: ${{ secrets.DEMO_PATH || '/opt/jellyglance-demo' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_NAME: ${{ vars.DEMO_SERVER_NAME || 'jellyglance-demo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With a Hetzner token and no DEMO_HOST, look the server up by name.
      - uses: ./.github/actions/hcloud
        if: env.DEMO_HOST == '' && env.HCLOUD_TOKEN != ''

      - name: Check settings
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          SNIPPY_ENROLL_TOKEN: ${{ secrets.SNIPPY_ENROLL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Add the DEMO_SSH_KEY secret first."
            exit 1
          fi
          if [ -z "$SNIPPY_ENROLL_TOKEN" ]; then
            echo "::error::Add the SNIPPY_ENROLL_TOKEN secret first."
            exit 1
          fi
          case "$SNIPPY_ENROLL_TOKEN" in
            *[$'\n\r']*)
              echo "::error::SNIPPY_ENROLL_TOKEN must be a single line."
              exit 1
              ;;
          esac
          printf '::add-mask::%s\n' "$SNIPPY_ENROLL_TOKEN"
          if [ -z "$DEMO_HOST" ] && [ -n "$HCLOUD_TOKEN" ]; then
            if DEMO_HOST=$(hcloud server ip "$SERVER_NAME" 2>/dev/null); then
              echo "DEMO_HOST=$DEMO_HOST" >> "$GITHUB_ENV"
            fi
          fi
          if [ -z "${DEMO_HOST:-}" ]; then
            echo "::error::No DEMO_HOST and no Hetzner server to install on."
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/demo
          chmod 600 ~/.ssh/demo
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEMO_SSH_KNOWN_HOSTS is not set; trusting the server's key on first use."
            ssh-keyscan -p "$DEMO_SSH_PORT" "$DEMO_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Install agent
        env:
          SNIPPY_ENROLL_TOKEN: ${{ secrets.SNIPPY_ENROLL_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SNIPPY_ENROLL_TOKEN"
          # Confirm this is the demo host before enrolling it.
          ssh -i "$HOME/.ssh/demo" -p "$DEMO_SSH_PORT" -o BatchMode=yes \
            "$DEMO_SSH_USER@$DEMO_HOST" "test -d $(printf '%q' "$DEMO_PATH")"
          # The enrol token is stdin only. It is not part of the ssh command.
          # Alpine does not ship nsenter; util-linux is installed only when it is missing.
          # The shell installer is /agent/install.sh; the site root is the web app.
          remote=$(cat <<'REMOTE'
          set -euo pipefail
          token=$(cat)
          if [ -z "$token" ]; then
            echo "Enrollment token was empty." >&2
            exit 1
          fi
          printf '%s' "$token" | docker run --rm -i --privileged --pid=host -v /:/host alpine:3.20 \
            sh -c 'if ! command -v nsenter >/dev/null 2>&1; then apk add --no-cache util-linux >/dev/null; fi
          exec nsenter -t 1 -m -u -i -n -- bash -c '\''set -euo pipefail
          token=$(cat)
          tmp=$(mktemp)
          cleanup() { rm -f "$tmp"; }
          trap cleanup EXIT
          curl -fsSL https://snippycode.bjr-home.uk/agent/install.sh -o "$tmp"
          bash "$tmp" --url https://snippycode.bjr-home.uk --token "$token" --name jellyfindemo
          '\'''
          REMOTE
          )
          printf '%s' "$SNIPPY_ENROLL_TOKEN" | ssh -i "$HOME/.ssh/demo" -p "$DEMO_SSH_PORT" -o BatchMode=yes \
            "$DEMO_SSH_USER@$DEMO_HOST" "bash -c $(printf '%q' "$remote")"

      - name: Check the agent is running
        run: |
          set -euo pipefail
          remote=$(cat <<'REMOTE'
          set -euo pipefail
          docker run --rm --privileged --pid=host -v /:/host alpine:3.20 \
            sh -c 'if ! command -v nsenter >/dev/null 2>&1; then apk add --no-cache util-linux >/dev/null; fi
          exec nsenter -t 1 -m -u -i -n -- bash -c '\''set -euo pipefail
          status=$(systemctl is-active snippycode-agent || true)
          printf "%s\n%s\n" "$(hostname)" "$status"
          test "$status" = active
          '\'''
          REMOTE
          )
          ssh -i "$HOME/.ssh/demo" -p "$DEMO_SSH_PORT" -o BatchMode=yes -o LogLevel=ERROR \
            "$DEMO_SSH_USER@$DEMO_HOST" "bash -c $(printf '%q' "$remote")"
