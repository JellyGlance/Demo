name: Test, build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily redeploy so the demo picks up new JellyGlance releases.
    - cron: "15 5 * * *"

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

env:
  # Lowercase, as GHCR requires; matches the image in docker-compose.yml.
  IMAGE: ghcr.io/jellyglance/demo

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check docker-compose.yml
        env:
          POSTGRES_PASSWORD: ci
          JWT_SECRET: ci
          DEMO_PASSWORD: ci
        run: docker compose config --quiet

  image:
    name: Build image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment: demo
    env:
      DEMO_HOST: ${{ secrets.DEMO_HOST }}
      DEMO_SSH_USER: ${{ secrets.DEMO_SSH_USER || 'deploy' }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      SERVER_NAME: ${{ vars.DEMO_SERVER_NAME || 'jellyglance-demo' }}
      DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
      DEMO_PATH: ${{ secrets.DEMO_PATH || '/opt/jellyglance-demo' }}
      DEMO_SSH_PORT: ${{ secrets.DEMO_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With a Hetzner token and no DEMO_HOST, look the server up by name.
      - uses: ./.github/actions/hcloud
        if: env.DEMO_HOST == '' && env.HCLOUD_TOKEN != ''

      - name: Check deploy settings
        id: settings
        run: |
          # Tidy the domain: no scheme, path, spaces or trailing dot.
          if [ -n "$DEMO_DOMAIN" ]; then
            domain=$(printf '%s' "$DEMO_DOMAIN" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#\.+$##')
            echo "DEMO_DOMAIN=$domain" >> "$GITHUB_ENV"
          fi
          if [ -z "$DEMO_HOST" ] && [ -n "$HCLOUD_TOKEN" ]; then
            if DEMO_HOST=$(hcloud server ip "$SERVER_NAME" 2>/dev/null); then
              echo "DEMO_HOST=$DEMO_HOST" >> "$GITHUB_ENV"
            else
              echo "::warning::No Hetzner server called $SERVER_NAME yet; run the Provision Hetzner server workflow first."
            fi
          fi
          if [ -z "$DEMO_HOST" ]; then
            echo "No DEMO_HOST and no Hetzner server, so there is nowhere to deploy. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.settings.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/demo && chmod 600 ~/.ssh/demo
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEMO_SSH_KNOWN_HOSTS is not set; trusting the server's key on first use."
            ssh-keyscan -p "$DEMO_SSH_PORT" "$DEMO_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload compose file and settings
        if: steps.settings.outputs.skip != 'true'
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # Repository variable (Settings → Secrets and variables → Actions → Variables); a secret also works.
          TMDB_API_KEY: ${{ vars.TMDB_API_KEY || secrets.TMDB_API_KEY }}
          EXTRA_ENV: ${{ vars.DEMO_EXTRA_ENV }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
        run: |
          SSH="ssh -i $HOME/.ssh/demo -p $DEMO_SSH_PORT -o BatchMode=yes $DEMO_SSH_USER@$DEMO_HOST"
          $SSH "mkdir -p '$DEMO_PATH'"
          scp -i ~/.ssh/demo -P "$DEMO_SSH_PORT" -o BatchMode=yes docker-compose.yml "$DEMO_SSH_USER@$DEMO_HOST:$DEMO_PATH/docker-compose.yml"
          # Write .env from repository secrets when they are set; otherwise keep the server's own .env.
          if [ -n "$POSTGRES_PASSWORD" ] && [ -n "$JWT_SECRET" ] && [ -n "$DEMO_PASSWORD" ]; then
            {
              printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\nDEMO_PASSWORD=%s\nTMDB_API_KEY=%s\nDEMO_IMAGE_TAG=%s\n' \
                "$POSTGRES_PASSWORD" "$JWT_SECRET" "$DEMO_PASSWORD" "$TMDB_API_KEY" "$IMAGE_TAG"
              if [ -n "$DEMO_DOMAIN" ]; then
                # Caddy answers on 80/443 with a certificate for the domain and proxies to the gateway.
                printf 'DEMO_DOMAIN=%s\nCOMPOSE_PROFILES=https\nGATEWAY_BEHIND_PROXY=true\nDEMO_PORT=127.0.0.1:8080\n' "$DEMO_DOMAIN"
              elif [ -n "$HCLOUD_TOKEN" ]; then
                # No domain yet: serve plain HTTP on port 80.
                printf 'DEMO_PORT=80\n'
              fi
              if [ -n "$EXTRA_ENV" ]; then printf '%s\n' "$EXTRA_ENV"; fi
            } | $SSH "umask 077 && cat > '$DEMO_PATH/.env'"
          else
            $SSH "cd '$DEMO_PATH' && test -f .env && sed -i '/^DEMO_IMAGE_TAG=/d' .env && echo 'DEMO_IMAGE_TAG=$IMAGE_TAG' >> .env"
          fi

      - name: Pull and restart
        if: steps.settings.outputs.skip != 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i $HOME/.ssh/demo -p $DEMO_SSH_PORT -o BatchMode=yes $DEMO_SSH_USER@$DEMO_HOST"
          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"
          $SSH "cd '$DEMO_PATH' && if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi; \$DC pull --quiet && \$DC up -d --remove-orphans && docker image prune -f >/dev/null; docker logout ghcr.io >/dev/null"
          # JellyGlance sets itself up from the environment once, at startup. If that ran before the
          # fake Jellyfin was ready, it is still on the setup screen; a restart runs it again.
          $SSH "cd '$DEMO_PATH' && if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi; \
            for _ in \$(seq 1 30); do \
              state=\$(\$DC exec -T jellyglance node -e \"fetch('http://localhost:3000/auth/isConfigured').then(r=>r.json()).then(j=>console.log(j.state),()=>console.log('down'))\" 2>/dev/null); \
              [ \"\$state\" != down ] && [ -n \"\$state\" ] && break; sleep 5; \
            done; \
            echo \"JellyGlance setup state: \$state\"; \
            if [ \"\$state\" != 2 ]; then echo 'Not set up yet; restarting JellyGlance'; \$DC restart jellyglance; fi"
          echo "Deployed ${{ needs.image.outputs.tag }} to ${DEMO_DOMAIN:-$DEMO_HOST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show status
        if: steps.settings.outputs.skip != 'true'
        run: |
          SSH="ssh -i $HOME/.ssh/demo -p $DEMO_SSH_PORT -o BatchMode=yes $DEMO_SSH_USER@$DEMO_HOST"
          $SSH "cd '$DEMO_PATH' && if docker compose version >/dev/null 2>&1; then DC='docker compose'; else DC='docker-compose'; fi; \$DC ps; echo; \$DC logs --no-color --tail 400 jellyglance | grep -E 'BOOTSTRAP|Error|error' | tail -20; echo; \$DC logs --no-color --tail 15 mock-services seeder"
